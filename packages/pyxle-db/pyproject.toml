[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-db"
version = "0.1.0"
description = "SQLite-first database plugin for Pyxle: connection pool, migrations, typed query helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pyxle", email = "dev@pyxle.dev" },
]
keywords = ["pyxle", "sqlite", "database", "migrations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "pyxle-framework>=0.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://pyxle.dev"
Source = "https://github.com/pyxle-framework/pyxle-plugins"

[tool.hatch.build.targets.wheel]
packages = ["pyxle_db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
