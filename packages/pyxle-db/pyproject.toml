[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-db"
version = "0.3.1"
description = "Database plugin for Pyxle: SQLite, PostgreSQL, and MySQL with one explicit-SQL API, portable qmark placeholders, and checksum-tracked migrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pyxle", email = "dev@pyxle.dev" },
]
keywords = ["pyxle", "sqlite", "postgresql", "mysql", "database", "migrations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
]
dependencies = [
  "pyxle-framework>=0.4.0",
]

[project.optional-dependencies]
sqlalchemy = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  # The async SQLAlchemy SQLite driver. The explicit-SQL path still uses the
  # stdlib sqlite3 module, so this is only needed for the ORM path.
  "aiosqlite>=0.19",
]
postgres = [
  "asyncpg>=0.29",
]
mysql = [
  "asyncmy>=0.2.9",
  # MySQL 8's default caching_sha2_password auth needs this at connect time;
  # without it every modern server greets users with a RuntimeError.
  "cryptography>=42",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://pyxle.dev"
Source = "https://github.com/pyxle-dev/pyxle-plugins"
Changelog = "https://github.com/pyxle-dev/pyxle-plugins/blob/main/packages/pyxle-db/CHANGELOG.md"

[project.scripts]
pyxle-db = "pyxle_db.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pyxle_db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage runs by default so the floor is enforced wherever the suite runs, not
# only in CI — a gate you cannot reproduce locally is a gate you discover in a
# pull request. Pass --no-cov when running a single test for a quick loop.
addopts = "--cov=pyxle_db --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["pyxle_db"]

[tool.coverage.report]
# ---------------------------------------------------------------------------
# THE FLOOR ONLY MOVES UP.
#
# Measured 92.0575% on 2026-08-18 (branch coverage, live PostgreSQL + MySQL
# engines running). The project-wide target is 95%; this package closes that gap
# in the first post-launch release. What is written here is what is true and
# enforced today, which is worth more than a target no one ever measured — this
# gate had never been wired at all before, and both numbers below 95% were
# discovered only when someone finally ran it.
#
# Raising it: improve coverage, read the new TOTAL, put it here in the same
# change. That is the only edit to this line that needs no explanation.
#
# Lowering it: needs a reason stated in the pull request. It is not a knob for
# turning a red build green — if coverage dropped, the tests that used to cover
# that code are the thing to look at.
#
# Measured with the live PostgreSQL + MySQL engines running. Without them the
# live suites skip -- 116 tests here -- and their coverage goes with them, so
# the run lands below this floor. That is the gate telling the truth: a skipped
# suite is not a passing suite. See the README's "Coverage floors" section.
# ---------------------------------------------------------------------------
fail_under = 92.0
precision = 2
show_missing = true

[tool.ruff.lint.per-file-ignores]
# The dialect-specific backend tests guard their imports behind
# `pytest.importorskip("asyncpg"/"asyncmy")`, so those imports are deliberately
# below the call — E402 is expected and correct here.
"tests/test_backend_*.py" = ["E402"]
