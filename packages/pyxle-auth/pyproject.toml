[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-auth"
version = "0.2.0"
description = "Authentication plugin for Pyxle: argon2id sessions, password reset and email verification flows, RBAC, scoped API tokens, and request guards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pyxle", email = "dev@pyxle.dev" },
]
keywords = ["pyxle", "auth", "sessions", "argon2", "rbac", "tokens"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "pyxle-framework>=0.4.0",
  "pyxle-db>=0.2.0",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://pyxle.dev"
Source = "https://github.com/pyxle-dev/pyxle-plugins"
Changelog = "https://github.com/pyxle-dev/pyxle-plugins/blob/main/packages/pyxle-auth/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# Hatchling ships every file under the package, so the bundled
# migrations (pyxle_auth/migrations/*.sql) ride along in the wheel.
packages = ["pyxle_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
