[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-auth"
version = "0.4.2"
description = "Authentication plugin for Pyxle: email- or username-based identity, argon2id sessions, password reset and email verification flows, RBAC, scoped API tokens, and request guards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pyxle", email = "dev@pyxle.dev" },
]
keywords = ["pyxle", "auth", "sessions", "argon2", "rbac", "tokens"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "pyxle-framework>=0.4.0",
  "pyxle-db>=0.2.0",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Social sign-in (Google / GitHub / Discord). Only needed when the `oauth`
# plugin setting is configured; the rest of pyxle-auth never imports httpx.
oauth = [
  "httpx>=0.24",
]
# JWT access tokens for API / mobile clients. Only needed when the `jwt`
# plugin setting is configured; the rest of pyxle-auth never imports pyjwt.
jwt = [
  "pyjwt>=2.4",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.24",
  "pyjwt>=2.4",
]

[project.urls]
Homepage = "https://pyxle.dev"
Source = "https://github.com/pyxle-dev/pyxle-plugins"
Changelog = "https://github.com/pyxle-dev/pyxle-plugins/blob/main/packages/pyxle-auth/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# Hatchling ships every file under the package, so the bundled
# migrations (pyxle_auth/migrations/*.sql) ride along in the wheel.
packages = ["pyxle_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage runs by default so the floor is enforced wherever the suite runs, not
# only in CI — a gate you cannot reproduce locally is a gate you discover in a
# pull request. Pass --no-cov when running a single test for a quick loop.
addopts = "--cov=pyxle_auth --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["pyxle_auth"]

[tool.coverage.report]
# ---------------------------------------------------------------------------
# THE FLOOR ONLY MOVES UP.
#
# Measured 92.3956% on 2026-08-18 (branch coverage, live PostgreSQL + MySQL
# engines running). The project-wide target is 95%; this package closes that gap
# in the first post-launch release. What is written here is what is true and
# enforced today, which is worth more than a target no one ever measured — this
# gate had never been wired at all before, and both numbers below 95% were
# discovered only when someone finally ran it.
#
# Raising it: improve coverage, read the new TOTAL, put it here in the same
# change. That is the only edit to this line that needs no explanation.
#
# Lowering it: needs a reason stated in the pull request. It is not a knob for
# turning a red build green — if coverage dropped, the tests that used to cover
# that code are the thing to look at.
#
# Measured with the live PostgreSQL + MySQL engines running. Without them the
# schema-portability and account-lifecycle suites skip and their coverage goes
# with them, so the run lands below this floor. That is the gate telling the
# truth: a skipped suite is not a passing suite. See the README's "Coverage
# floors" section.
# ---------------------------------------------------------------------------
fail_under = 92.3
precision = 2
show_missing = true
