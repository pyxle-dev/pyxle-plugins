[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-mail"
version = "0.1.0"
description = "Email plugin for Pyxle: one mail.service over SMTP, Resend, or any MailProvider, with a logs-instead-of-sends dev mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pyxle", email = "dev@pyxle.dev" },
]
keywords = ["pyxle", "email", "mail", "smtp", "resend", "transactional"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
dependencies = [
  "pyxle-framework>=0.4.0",
]

[project.optional-dependencies]
# SMTP needs nothing beyond the stdlib (smtplib, run in a thread). The Resend
# provider talks to a REST API over httpx; only pull it in if you use it.
resend = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://pyxle.dev"
Source = "https://github.com/pyxle-dev/pyxle-plugins"
Changelog = "https://github.com/pyxle-dev/pyxle-plugins/blob/main/packages/pyxle-mail/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["pyxle_mail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
