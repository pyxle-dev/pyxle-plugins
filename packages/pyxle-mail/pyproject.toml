[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pyxle-mail"
version = "0.1.0"
description = "Email plugin for Pyxle: one mail.service over SMTP, Resend, or any MailProvider, with a logs-instead-of-sends dev mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pyxle", email = "dev@pyxle.dev" },
]
keywords = ["pyxle", "email", "mail", "smtp", "resend", "transactional"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
dependencies = [
  "pyxle-framework>=0.4.0",
]

[project.optional-dependencies]
# SMTP needs nothing beyond the stdlib (smtplib, run in a thread). The Resend
# provider talks to a REST API over httpx; only pull it in if you use it.
resend = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://pyxle.dev"
Source = "https://github.com/pyxle-dev/pyxle-plugins"
Changelog = "https://github.com/pyxle-dev/pyxle-plugins/blob/main/packages/pyxle-mail/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["pyxle_mail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage runs by default so the floor is enforced wherever the suite runs, not
# only in CI — a gate you cannot reproduce locally is a gate you discover in a
# pull request. Pass --no-cov when running a single test for a quick loop.
addopts = "--cov=pyxle_mail --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["pyxle_mail"]

[tool.coverage.report]
# ---------------------------------------------------------------------------
# THE FLOOR ONLY MOVES UP.
#
# Measured 95.8435% on 2026-08-18 (branch coverage). The project-wide target is 95%; this package closes that gap
# in the first post-launch release. What is written here is what is true and
# enforced today, which is worth more than a target no one ever measured — this
# gate had never been wired at all before, and both numbers below 95% were
# discovered only when someone finally ran it.
#
# Raising it: improve coverage, read the new TOTAL, put it here in the same
# change. That is the only edit to this line that needs no explanation.
#
# Lowering it: needs a reason stated in the pull request. It is not a knob for
# turning a red build green — if coverage dropped, the tests that used to cover
# that code are the thing to look at.
#
# This package needs no database engines. Its one conditional suite is the live
# SMTP round trip (PYXLE_MAIL_TEST_SMTP_HOST, e.g. Mailpit), which CI does not
# require and which does not affect this floor. See the README's "Coverage
# floors" section.
# ---------------------------------------------------------------------------
fail_under = 95.8
precision = 2
show_missing = true
